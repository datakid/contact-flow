name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ci/apk-on-demand]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --flavor lite --target-platform android-arm64
      - run: flutter build apk --release --flavor full --dart-define=CALLS=true --target-platform android-arm64
      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-lite-release.apk dist/contact-flow-lite.apk
          cp build/app/outputs/flutter-apk/app-full-release.apk dist/contact-flow-full.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: contact-flow-apks
          path: dist/*.apk
          retention-days: 14
