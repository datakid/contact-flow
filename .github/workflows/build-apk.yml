name: build-apk

on:
  workflow_dispatch:
    inputs:
      builds:
        description: What to build
        type: choice
        default: release-apk
        options:
          - release-apk
          - everything

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: release apks (arm64)
        if: inputs.builds != 'everything'
        run: |
          flutter build apk --release --flavor lite --target-platform android-arm64
          flutter build apk --release --flavor full --dart-define=CALLS=true --target-platform android-arm64
          mkdir dist
          cp build/app/outputs/flutter-apk/app-lite-release.apk dist/contact-flow-lite.apk
          cp build/app/outputs/flutter-apk/app-full-release.apk dist/contact-flow-full.apk
      - name: everything
        if: inputs.builds == 'everything'
        run: |
          mkdir dist
          flutter build apk --release --flavor lite --split-per-abi
          flutter build apk --release --flavor full --dart-define=CALLS=true --split-per-abi
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          flutter build apk --debug --flavor lite
          cp build/app/outputs/flutter-apk/app-lite-debug.apk dist/
          flutter build apk --debug --flavor full --dart-define=CALLS=true
          cp build/app/outputs/flutter-apk/app-full-debug.apk dist/
          tool/check_permissions.sh
          flutter build web
          (cd build/web && zip -qr ../../dist/contact-flow-web.zip .)
      - run: ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: contact-flow-builds
          path: dist/*
          retention-days: 14
