name: diagnose

on:
  push:
    branches: ['ci/diagnose']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - name: prepare
        run: |
          mkdir -p /tmp/rep
          flutter config --no-analytics
          flutter --version 2>&1 | tee /tmp/rep/version.txt
      - name: pub get
        run: |
          set +e
          flutter pub get 2>&1 | tee /tmp/rep/pubget.txt
          cp pubspec.lock /tmp/rep/pubspec.lock
          exit 0
      - name: format check
        run: |
          set +e
          dart format --output=none --set-exit-if-changed . > /tmp/rep/format_check.txt 2>&1
          echo "exit $?" >> /tmp/rep/format_check.txt
          exit 0
      - name: format
        run: |
          set +e
          dart format . 2>&1 | tail -n 5 | tee /tmp/rep/format.txt
          git diff --stat | tail -n 3 >> /tmp/rep/format.txt
          git diff > /tmp/rep/format.patch
          exit 0
      - name: analyze
        timeout-minutes: 15
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/rep/analyze.txt
          exit 0
      - name: publish 1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tool/publish_report.sh
      - name: test
        timeout-minutes: 25
        run: |
          set +e
          flutter test --exclude-tags "perf || golden" --reporter expanded 2>&1 | tee /tmp/rep/test.txt
          exit 0
      - name: publish 2
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tool/publish_report.sh
      - name: build lite
        timeout-minutes: 20
        run: |
          set +e
          flutter build apk --debug --flavor lite 2>&1 | tail -n 80 | tee /tmp/rep/build_lite.txt
          exit 0
      - name: build full
        timeout-minutes: 20
        run: |
          set +e
          flutter build apk --debug --flavor full --dart-define=CALLS=true 2>&1 | tail -n 80 | tee /tmp/rep/build_full.txt
          exit 0
      - name: permissions
        run: |
          set +e
          bash tool/check_permissions.sh > /tmp/rep/permissions.txt 2>&1
          echo "exit $?" >> /tmp/rep/permissions.txt
          exit 0
      - name: web build
        timeout-minutes: 15
        run: |
          set +e
          flutter build web 2>&1 | tail -n 30 > /tmp/rep/web.txt
          exit 0
      - name: goldens
        timeout-minutes: 20
        run: |
          set +e
          flutter test --tags golden --update-goldens --reporter expanded > /tmp/rep/goldens.txt 2>&1
          mkdir -p /tmp/rep/goldens
          cp test/goldens/*.png /tmp/rep/goldens/ 2>/dev/null
          exit 0
      - name: publish 3
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tool/publish_report.sh
      - name: perf
        timeout-minutes: 25
        run: |
          set +e
          for f in test/perf/*_test.dart; do
            n=$(basename "$f" .dart)
            timeout 400 flutter test "$f" --tags perf --reporter expanded > "/tmp/rep/perf_$n.txt" 2>&1
            echo "exit $?" >> "/tmp/rep/perf_$n.txt"
          done
          exit 0
      - name: publish 4
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tool/publish_report.sh
