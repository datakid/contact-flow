name: quick

on:
  push:
    branches: ['ci/quick**']

permissions:
  contents: write

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - name: run
        run: |
          set +e
          mkdir -p /tmp/rep
          flutter pub get > /dev/null 2>&1
          bash tool/quick.sh > /tmp/rep/quick.txt 2>&1
          echo "exit $?" >> /tmp/rep/quick.txt
          exit 0
      - name: publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tool/publish_report.sh
