<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Contact Flow — batch import and export contacts in CSV, vCard, Excel, TXT, JSON and Numbers.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Contact Flow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Contact Flow</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#F6F1E8}
    @media (prefers-color-scheme: dark){html,body{background:#141210}}
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
    #splash img{width:72px;height:72px;border-radius:20px;animation:b 1.6s ease-in-out infinite}
    @keyframes b{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame',function(){var s=document.getElementById('splash');s.style.opacity=0;setTimeout(function(){s.remove()},400)});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
